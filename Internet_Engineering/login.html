<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — SHOP</title>

    <link rel="icon" href="assets/img/5087579.png" />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        transition: background-color 0.3s ease;
      }

      body.dark {
        background: #0a0a0a;
      }

      .login-box {
        background: #ffffff;
        padding: 40px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        border: 1px solid #e0e0e0;
        transition: 0.3s;
      }

      body.dark .login-box {
        background: #111111;
        border-color: #222222;
      }

      .login-box:hover {
        border-color: #999;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      body.dark .login-box:hover {
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
      }

      .form-control {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        color: #212529;
        padding: 12px;
        border-radius: 10px;
      }

      body.dark .form-control {
        background: #1a1a1a;
        border-color: #2a2a2a;
        color: #ffffff;
      }

      .form-control:focus {
        border-color: #999;
        box-shadow: none;
      }

      .form-control::placeholder {
        color: #999;
      }

      .input-group-text {
        background: #e9ecef;
        border: 1px solid #dee2e6;
        color: #6c757d;
      }

      body.dark .input-group-text {
        background: #1a1a1a;
        border-color: #2a2a2a;
        color: #999;
      }

      .btn-login {
        background: #212529;
        color: #ffffff;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        width: 100%;
        transition: 0.3s;
      }

      body.dark .btn-login {
        background: #ffffff;
        color: #000000;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        background: #c2c2c2;
      }

      body.dark .btn-login:hover {
        background: #e0e0e0;
      }

      .social-icon {
        background: #f8f9fa;
        width: 45px;
        height: 45px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #212529;
        font-size: 20px;
        border: 1px solid #dee2e6;
        transition: 0.3s;
      }

      body.dark .social-icon {
        background: #1a1a1a;
        color: #ffffff;
        border-color: #2a2a2a;
      }

      .social-icon:hover {
        background: #e9ecef;
        transform: translateY(-2px);
      }

      body.dark .social-icon:hover {
        background: #2a2a2a;
      }

      a {
        color: #999;
        text-decoration: none;
        transition: 0.3s;
      }

      a:hover {
        color: #212529;
      }

      body.dark a:hover {
        color: #ffffff;
      }

      hr {
        border-color: #dee2e6;
      }

      body.dark hr {
        border-color: #2a2a2a;
      }

      .text-secondary-custom {
        color: #6c757d;
      }

      body.dark .text-secondary-custom {
        color: #999;
      }

      .text-primary-custom {
        color: #212529;
      }

      body.dark .text-primary-custom {
        color: #ffffff;
      }

      .theme-toggle-login {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #ffffff;
        color: #212529;
        border: 1px solid #dee2e6;
        cursor: pointer;
        font-size: 20px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      body.dark .theme-toggle-login {
        background: #111111;
        color: #ffffff;
        border-color: #222222;
      }

      .theme-toggle-login:hover {
        transform: scale(1.1);
        background: #e9ecef;
      }

      body.dark .theme-toggle-login:hover {
        background: #2a2a2a;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="text-center mb-4">
        <i class="bi bi-shop fs-1" style="color: #999"></i>
        <h3 class="mt-2 text-primary-custom">Welcome Back</h3>
        <p class="text-secondary-custom">Sign in to continue</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email"
              class="form-control"
              placeholder="Email"
              required
            />
          </div>
        </div>
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember" />
          <label class="form-check-label text-secondary-custom" for="remember"
            >Remember me</label
          >
          <a href="#" class="float-end">Forgot?</a>
        </div>
        <button type="submit" class="btn btn-login mb-3">Sign In</button>
      </form>

      <hr />

      <div class="text-center mb-3">
        <span class="text-secondary-custom">Or continue with</span>
      </div>
      <div class="d-flex justify-content-center gap-3">
        <a href="#" class="social-icon"><i class="bi bi-google"></i></a>
        <a href="#" class="social-icon"><i class="bi bi-github"></i></a>
        <a href="#" class="social-icon"><i class="bi bi-facebook"></i></a>
      </div>

      <div class="text-center mt-4">
        <span class="text-secondary-custom">Don't have an account? </span>
        <a href="#">Sign up</a>
      </div>
    </div>

    <button class="theme-toggle-login" id="themeToggleLogin">🌙</button>

    <script>
      const themeBtn = document.getElementById("themeToggleLogin");
      const body = document.body;

      if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark");
        themeBtn.innerHTML = "☀️";
      }

      themeBtn.addEventListener("click", () => {
        const isDark = body.classList.toggle("dark");
        themeBtn.innerHTML = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("coming soon!");
      });
    </script>
  </body>
</html>
